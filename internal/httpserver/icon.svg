<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- HappySorter app icon: a clean smirk face on the brand indigo gradient tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5bd6"/>
      <stop offset="1" stop-color="#3a3aa8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square tile -->
  <rect width="96" height="96" rx="22" fill="url(#tile)"/>

  <!-- Face: clean white circle -->
  <circle cx="48" cy="50" r="26" fill="#ffffff"/>

  <!-- Left eye: closed wink arc -->
  <path d="M34 48 Q38 43 42 48" stroke="#1f1147" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Right eye: small open dot -->
  <circle cx="60" cy="46" r="2.6" fill="#1f1147"/>

  <!-- Smirk: asymmetric curve, right side raised -->
  <path d="M38 62 Q48 70 60 60" stroke="#1f1147" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>